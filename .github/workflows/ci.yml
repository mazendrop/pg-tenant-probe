name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · PGlite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # With DATABASE_URL set, the tests create and drop a throwaway database on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: CLI against the fixture (it contains deliberate leaks, so exit code 1 is expected)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database cli_demo"
          psql "postgres://postgres:postgres@localhost:5432/cli_demo" -v ON_ERROR_STOP=1 -q -f test/fixture.sql
          set +e
          node dist/cli.js --config examples/fixture.config.json --writes \
            --db postgres://postgres:postgres@localhost:5432/cli_demo
          code=$?
          set -e
          test "$code" -eq 1
